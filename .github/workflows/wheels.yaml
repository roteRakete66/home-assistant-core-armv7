name: Build wheels

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'normal'
        type: choice
        options:
          - 'normal'
          - 'full'
  push:
    branches:
      - dev
      - rc
    paths:
      - ".github/workflows/wheels.yaml"
      - "homeassistant/package_constraints.txt"
      - "requirements_all.txt"
      - "requirements.txt"
      - "script/gen_requirements_all.py"

env:
  DEFAULT_PYTHON: "3.13"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name}}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize wheels builder
    if: github.repository_owner == vars.GH_OWNER 
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
    steps:
      - &checkout
        name: Checkout the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master

      - name: Write env-file
        run: |
          (
            echo "GRPC_PYTHON_BUILD_SYSTEM_OPENSSL=true"
            echo "GRPC_PYTHON_BUILD_WITH_CYTHON=true"

            # Fix out of memory issues with rust
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"

            # OpenCV headless installation
            echo "CI_BUILD=1"
            echo "ENABLE_HEADLESS=1"

            # Use C-Extension for SQLAlchemy
            echo "REQUIRE_SQLALCHEMY_CEXT=1"

            # Add additional pip wheel build constraints
            echo "PIP_CONSTRAINT=build_constraints.txt"
          ) > .env_file

      - name: Write pip wheel build constraints
        run: |
          (
            # ninja 1.11.1.2 + 1.11.1.3 seem to be broken on at least armhf
            # this caused the numpy builds to fail
            # https://github.com/scikit-build/ninja-python-distributions/issues/274
            echo "ninja==1.11.1.1"
          ) > build_constraints.txt

      - name: Upload env_file
        uses: &actions-upload-artifact actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: env_file
          path: ./.env_file
          include-hidden-files: true
          overwrite: true

  core:
    name: Build Core wheels ${{ matrix.abi }} for ${{ matrix.arch }} (musllinux_1_2)
    if: github.repository_owner == vars.GH_OWNER
    needs: init
    runs-on: ${{ matrix.os }}
    env:
      IMAGE: "ghcr.io/${{ vars.GH_USER }}/wheels-core:${{ matrix.arch }}-${{ matrix.abi }}"
    strategy:
      fail-fast: false
      matrix: # &matrix-build
        abi: ["cp313", "cp314"]
        arch: ${{ fromJson(needs.init.outputs.architectures) }}
        include:
          - os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
        exclude:
          - abi: cp314
            arch: armv7
          - abi: cp314
            arch: armhf
          - abi: cp314
            arch: i386
    steps:
      - *checkout

      - &download-env-file
        name: Download env_file
        uses: &actions-download-artifact actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: env_file

      - &adjust-build-env
        name: Adjust build env
        run: |
          if [ "${{ matrix.arch }}" = "i386" ]; then
            echo "NPY_DISABLE_SVML=1" >> .env_file
          fi

          # Do not pin numpy in wheels building
          sed -i "/numpy/d" homeassistant/package_constraints.txt
          # Don't build wheels for uv as uv requires a greater version of rust as currently available on alpine
          sed -i "/uv/d" requirements.txt

      - &python-ver
        name: Set up Python ${{ matrix.abi == 'cp313' && '3.13' || '3.14' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.abi == 'cp313' && '3.13' || '3.14' }}

      - name: Create requirements_diff file
        id: check_diff
        run: |
          grep -E '^[a-zA-Z0-9].*==.+' requirements.txt | sort > s_requirements.txt

          if [[ ${{ github.event.inputs.build_mode || 'normal' }} == 'normal' ]]; then
            curl -s -o requirements_current.txt https://raw.githubusercontent.com/home-assistant/core/fc8f8b39b44cf24a8ed984f9b75951ad60a18810/requirements.txt
            grep -E '^[a-zA-Z0-9].*==.+' requirements_current.txt | sort > s_requirements_current.txt
            comm -13 s_requirements_current.txt s_requirements.txt > requirements_diff.txt
          else
            cp s_requirements.txt requirements_diff.txt
          fi

          if [ -s requirements_diff.txt ]; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - &ghcr-login
        name: Log in to GHCR
        if: steps.check_diff.outputs.build_needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GH_USER }}
          password: ${{ secrets.GH_TOKEN }}

      - &build
        name: Build and Sync Wheels
        if: steps.check_diff.outputs.build_needed == 'true'
        run: |
          mkdir -p final_wheels

          if docker pull $IMAGE; then
            CONTAINER_ID=$(docker create $IMAGE sh)
            docker cp $CONTAINER_ID:/wheels/. ./final_wheels/
            docker rm $CONTAINER_ID
          fi

          pip wheel --wheel-dir ./final_wheels -r requirements_diff.txt
          pip wheel --wheel-dir ./final_wheels \
                    -c homeassistant/package_constraints.txt \
                    -r requirements_diff.txt
      - &push-ghcr
        name: Push wheels to GHCR
        if: steps.check_diff.outputs.build_needed == 'true'
        run: |
          mkdir -p sync_wheels
          while read -r line; do
            PKG_NAME=$(echo $line | cut -d'=' -f1 | sed 's/-/_/g')
            PKG_VER=$(echo $line | awk -F'==' '{print $2}')
            cp ./final_wheels/${PKG_NAME}-${PKG_VER}-*.whl ./sync_wheels/ 2>/dev/null || true
          done < s_requirements.txt

          COUNT=$(ls -1 ./sync_wheels/*.whl 2>/dev/null | wc -l || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "FROM scratch" > Dockerfile.wheels
            echo "COPY ./sync_wheels/*.whl /wheels/" >> Dockerfile.wheels
            docker build -t $IMAGE -f Dockerfile.wheels .
            docker push $IMAGE
          fi

  integrations:
    name: Build wheels ${{ matrix.abi }} for ${{ matrix.arch }}
    if: github.repository_owner == vars.GH_OWNER
    needs: init
    runs-on: ${{ matrix.os }}
    env:
      IMAGE: "ghcr.io/${{ vars.GH_USER }}/wheels-integrations:${{ matrix.arch }}-${{ matrix.abi }}"
    strategy:
      fail-fast: false
      matrix:
        abi: ["cp313"]
        arch: ${{ fromJson(needs.init.outputs.architectures) }}
        include:
          - os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - *checkout
      - *download-env-file
      - *adjust-build-env
      - *python-ver

      - name: Create requirements_diff file
        id: check_diff
        run: |
          grep -E '^[a-zA-Z0-9].*==.+' requirements.txt | sort > s_requirements.txt
          grep -E '^[a-zA-Z0-9].*==.+' requirements_all.txt | sort > s_requirements_all.txt

          if [[ ${{ github.event.inputs.build_mode || 'normal' }} == 'normal' ]]; then
            curl -s -o requirements_current.txt https://raw.githubusercontent.com/home-assistant/core/fc8f8b39b44cf24a8ed984f9b75951ad60a18810/requirements.txt
            grep -E '^[a-zA-Z0-9].*==.+' requirements_current.txt | sort > s_requirements_current.txt
            comm -13 s_requirements_current.txt s_requirements.txt > s_requirements_diff.txt

            curl -s -o requirements_all_current.txt https://raw.githubusercontent.com/home-assistant/core/fc8f8b39b44cf24a8ed984f9b75951ad60a18810/requirements_all.txt
            sed -i 's/^aioasuswrt==1.5.1$/aioasuswrt==2.2.0/' requirements_all_current.txt
            grep -E '^[a-zA-Z0-9].*==.+' requirements_all_current.txt | sort > s_requirements_all_current.txt
            comm -13 s_requirements_all_current.txt s_requirements_all.txt > s_requirements_all_diff.txt

            cat s_requirements_diff.txt s_requirements_all_diff.txt > requirements_diff.txt
          else
            cat s_requirements.txt s_requirements_all.txt > requirements_diff.txt
          fi

          cat s_requirements_all.txt >> s_requirements.txt

          if [ -s requirements_diff.txt ]; then
            echo "build_needed=true" >> $GITHUB_OUTPUT
          else
            echo "build_needed=false" >> $GITHUB_OUTPUT
          fi

      - *ghcr-login
      - *build
      - *push-ghcr
